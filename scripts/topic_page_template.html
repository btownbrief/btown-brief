<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · The Pulse</title>
<meta name="description" content="{{DEK}}">
<style>
/* Every colour comes from a token, so both themes are complete. */
:root {
  --paper: #FBFAF7;
  --ink: #1C2431;
  --muted: #5C6675;
  --accent: #8E2C35;
  --rule: #E2DED4;
  --card: #FFFFFF;
  --shadow: rgba(28, 36, 49, .07);
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #14181F;
    --ink: #E8E4DB;
    --muted: #9AA3B0;
    --accent: #D96A72;
    --rule: #2A303A;
    --card: #1B2029;
    --shadow: rgba(0, 0, 0, .35);
  }
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: Charter, "Bitstream Charter", "Iowan Old Style", Georgia,
               "Times New Roman", serif;
  font-size: 18px;
  line-height: 1.62;
  overflow-x: hidden;
}

.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 20px 72px;
}

a { color: var(--accent); }
a:hover { text-decoration: none; }

/* ---------- masthead ---------- */
.masthead {
  border-bottom: 1px solid var(--rule);
  margin-bottom: 40px;
}
.masthead a {
  display: inline-block;
  padding: 18px 0 14px;
  font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--muted);
  text-decoration: none;
}
.masthead a:hover { color: var(--accent); }

/* ---------- head ---------- */
.eyebrow {
  font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 12px;
}
h1 {
  margin: 0 0 18px;
  font-size: clamp(2rem, 7vw, 3rem);
  line-height: 1.1;
  letter-spacing: -.01em;
  font-weight: 700;
}
.dek {
  margin: 0 0 8px;
  font-size: 1.2rem;
  line-height: 1.5;
  color: var(--muted);
}

/* ---------- section scaffolding ---------- */
section { margin-top: 52px; }
.label {
  font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--muted);
  padding-bottom: 8px;
  border-bottom: 2px solid var(--accent);
  margin: 0 0 26px;
}
h2 {
  margin: 34px 0 10px;
  font-size: 1.4rem;
  line-height: 1.25;
  font-weight: 700;
}
p { margin: 0 0 18px; }
.further {
  margin-top: 26px;
  padding-top: 18px;
  border-top: 1px solid var(--rule);
  font-size: .98rem;
  color: var(--muted);
}

/* ---------- watch ---------- */
.card {
  display: block;
  background: var(--card);
  border: 1px solid var(--rule);
  border-radius: 10px;
  padding: 16px 18px;
  margin-bottom: 14px;
  text-decoration: none;
  color: inherit;
  box-shadow: 0 1px 2px var(--shadow);
}
.card:hover { border-color: var(--accent); }
.card-title {
  font-weight: 700;
  line-height: 1.35;
  margin-bottom: 6px;
}
.meta {
  font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
  font-size: 12.5px;
  color: var(--muted);
}
.note {
  margin-top: 8px;
  font-size: .95rem;
  color: var(--muted);
  font-style: italic;
}

/* ---------- lurk + related ---------- */
ul.list { list-style: none; margin: 0; padding: 0; }
ul.list li {
  padding: 14px 0;
  border-bottom: 1px solid var(--rule);
}
ul.list li:first-child { padding-top: 0; }
ul.list a { font-weight: 700; text-decoration: none; line-height: 1.35; }
ul.list a:hover { text-decoration: underline; }

/* ---------- footer ---------- */
footer {
  margin-top: 64px;
  padding-top: 20px;
  border-top: 1px solid var(--rule);
  font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
  font-size: 13px;
  line-height: 1.6;
  color: var(--muted);
}
</style>
</head>
<body>
<div class="masthead"><div class="wrap"><a href="/pulse.html">The Pulse · Topics</a></div></div>
<div class="wrap">

<p class="eyebrow">{{EYEBROW}}</p>
<h1>{{TITLE}}</h1>
<p class="dek">{{DEK}}</p>

<section>
<p class="label">Read</p>
{{SECTIONS}}
</section>

{{WATCH}}

{{LURK}}

{{RELATED}}

<footer>
Compiled from Wikipedia, YouTube, Reddit and the Pulse's own coverage ·
every link verified {{DATE}} · requested by {{VOTES}} readers ·
<a href="/pulse.html">back to the Pulse</a>
</footer>

</div>
</body>
</html>
