<body>

  <header class="bar">
    <a class="brand" href="../things-to-do.html" title="Back to Things To Do">THE&nbsp;<b>COUNTDOWN</b></a>
    <div class="broadcast">
      <div class="dayrow"><span class="day" id="day">—</span><span class="date" id="date">—</span></div>
      <span class="clock-wrap"><span class="clock" id="clock">--:--:--</span><span class="ampm" id="ampm"></span></span>
    </div>
    <div class="status">
      <nav class="modes" aria-label="Site pages">
        <a class="mode" href="../events.html">Events</a>
        <a class="mode" href="../things-to-do.html">To Do</a>
      </nav>
      <a class="live-badge" href="#cd-add"><i aria-hidden="true"></i>Add yours</a>
    </div>
  </header>

  <p class="hint" id="cd-meta">Loading the year…</p>

  <main class="board" id="cd-stack" aria-label="Burlington countdowns"></main>

  <!-- ADD YOUR EVENT -->
  <section class="add" id="cd-add" aria-labelledby="cd-add-title">
    <div class="add-inner">
      <p class="add-kicker">The jar</p>
      <h2 id="cd-add-title">Add your event</h2>
      <p class="add-lede">This list is short on purpose. If yours belongs on it, make the case — the question at the bottom is the one that decides it.</p>

      <form class="cd-form" id="cd-form" novalidate>
        <label>Event name
          <input type="text" name="name" maxlength="120" autocomplete="off" placeholder="What it's called">
        </label>
        <div class="cd-row">
          <label>Date
            <input type="date" name="date">
          </label>
          <label>Where
            <input type="text" name="where" maxlength="120" autocomplete="off" placeholder="Venue or neighbourhood">
          </label>
        </div>
        <label>Link <small>(optional)</small>
          <input type="url" name="link" maxlength="300" autocomplete="off" placeholder="https://">
        </label>
        <label>Why should this be on the list?
          <textarea name="why" rows="4" maxlength="400" placeholder="What makes it one of the events the whole city counts down to?"></textarea>
        </label>
        <label>Your name or email <small>(optional, if you want an answer)</small>
          <input type="text" name="who" maxlength="120" autocomplete="off" placeholder="Optional">
        </label>
        <p class="cd-err" hidden></p>
        <button class="cd-submit" type="submit">Put it in the jar</button>
      </form>
    </div>
  </section>

  <footer class="lbar">
    <span class="lgroup"><span class="llbl">Board</span><span class="lopt on" id="cd-count">—</span></span>
    <span class="lgroup"><span class="llbl">Order</span><span class="lopt on">Soonest</span></span>
    <span class="lgroup"><span class="llbl">Dates</span><span class="lopt">Checked by hand</span></span>
    <span class="lright">
      <a class="lopt" href="#cd-add">Add yours ↵</a>
      <a class="lexit" href="https://www.btownbrief.com" target="_blank" rel="noopener">Btown Brief ↗</a>
    </span>
  </footer>

  <script src="https://play.btownbrief.com/nav.js" defer></script>
</body>
