  <script>
    /* Theme before first paint. Dark is this page's native mood (it's TV);
       the guide's cached sunrise/sunset still flips it light during the day
       like every other page, and the toggle wins for the session. */
    (function () {
      try {
        var c = JSON.parse(localStorage.getItem('btown-sun') || 'null');
        if (!c) return;
        var today = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York',
          year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
        if (c.day !== today) return;
        var n = Date.now();
        document.documentElement.setAttribute('data-theme',
          (n >= c.rise && n < c.set) ? 'light' : 'dark');
      } catch (e) {}
    })();
  </script>
