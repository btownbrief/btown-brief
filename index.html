<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BTown Brief — moved to the hub</title>
  <!-- The guide's front door retired 2026-08-24: one front door now, the hub.
       Every guide page (weather, events, restaurants, pulse, tv, …) still lives
       at its own guide.btownbrief.com address — only this landing page moved.
       GitHub Pages can't send a real 301, so: canonical + meta refresh + JS. -->
  <link rel="canonical" href="https://hub.btownbrief.com/">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://hub.btownbrief.com/">
  <script>location.replace('https://hub.btownbrief.com/');</script>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;
         font-family:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;
         background:#FAF6EF;color:#12222E;text-align:center;padding:24px}
    a{color:#1F5B8A}
    @media (prefers-color-scheme:dark){body{background:#0E1B24;color:#E8E2D6}a{color:#7FB4DC}}
  </style>
<!-- GoatCounter -->
<script data-goatcounter="https://btown-brief.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <p>Everything moved to one front door:<br>
  <a href="https://hub.btownbrief.com/"><b>hub.btownbrief.com</b></a> — every guide page is one tap from there.</p>
</body>
</html>
