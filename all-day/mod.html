<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Boards desk · All Day</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- Stephen's moderation page for the All Day boards (nn_ in Supabase).
       Photos on board posts are moderated where every reader photo is, in
       ../photo-admin.html; this page is for the posts themselves: what two
       reports took down, what a pre-moderated board is holding, bans, and
       People's list of plans whose hosts are down for Meetup, and the
       No-algorithm challenge's feedback (nn-CHALLENGE.sql). Opening it
       also sweeps stray board photos (nn-ROUND2.sql): queue photos nobody
       posted, and picture files that never made it into the queue.
       ?demo=1 runs on the in-memory fake with passphrase "demo". -->
  <link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png">
  <script>
    try {
      var t = localStorage.getItem('allday-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* the stylesheet default stands */ }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..600;1,400..600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css?v=20261016b">
  <link rel="stylesheet" href="css/app.css?v=20261016b">
</head>
<body class="desk">
  <main class="desk-col">
    <h1 class="desk-h">Boards desk</h1>
    <p class="sheet-note">Reader posts on People, Vintage, Art and the Watchlist. Two reports take a post down and it waits here. Photos are checked in the <a href="../photo-admin.html">photo desk</a>, like every reader photo.</p>
    <form class="signin" id="gate">
      <input class="field" type="password" id="pass" placeholder="Passphrase" autocomplete="current-password" aria-label="Moderator passphrase">
      <button class="btn" type="submit">Open</button>
    </form>
    <p class="sheet-note" id="gate-msg" role="status"></p>
    <div id="desk" hidden></div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module">
    import * as store from './js/store.js';
    import { BOARD_LABELS, REASON_LABELS } from './js/boards-core.js';
    import { FakeBoards, seedDemo } from './js/boards-fake.js';
    import { ARCHETYPES, MISSED, FEELINGS } from './js/challenge-core.js';

    const demo = new URLSearchParams(location.search).get('demo') === '1';
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const $ = (id) => document.getElementById(id);
    let fake = null;
    if (demo) {
      fake = seedDemo(new FakeBoards({ modSecret: 'demo' }));
      /* one post two neighbors reported, so the demo has something waiting */
      const p = fake.posts.find((x) => x.board === 'vintage');
      p.reports = 2; p.status = 'pending';
      fake.reports.push({ post_id: p.id, reporter: 'demo-a', reason: 'spam', at: Date.now() }, { post_id: p.id, reporter: 'demo-b', reason: 'unkind', at: Date.now() });
      /* and one picture file whose filing in the photo queue failed two days ago */
      fake.addFile('submissions/demo-stray-0001.jpg', Date.now() - 2 * 86400000);
    }

    /* the passphrase lives in this tab only, never in localStorage */
    let secret = sessionStorage.getItem('nn-mod') || '';

    async function rpc(fn, args) {
      if (demo) return fake.as(null).call(fn, args);
      const r = await fetch(store.SB_URL + '/rest/v1/rpc/' + fn, {
        method: 'POST', headers: { apikey: store.SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args),
      });
      const j = await r.json().catch(() => null);
      if (r.status === 404) return { error: 'not_installed' };
      if (!r.ok) return { error: (j && j.message) || 'offline' };
      return j;
    }
    /* The Storage API's remove, as the reader: the bucket's stray-photo
       policies (nn-ROUND2.sql) let it remove a stray and nothing else.
       Resolves how many files went. */
    async function removeFiles(paths) {
      if (demo) return fake.removeFiles(paths).length;
      const go = (auth) => fetch(store.SB_URL + '/storage/v1/object/btb-photos', {
        method: 'DELETE', headers: Object.assign({ apikey: store.SB_KEY, 'Content-Type': 'application/json' }, auth ? { Authorization: 'Bearer ' + store.SB_KEY } : {}),
        body: JSON.stringify({ prefixes: paths }),
      });
      try {
        let r = await go(false);
        /* some storage gateways also want the key as a bearer token (photos-lib.js does the same) */
        if ([400, 401, 403].includes(r.status)) r = await go(true);
        const j = await r.json().catch(() => null);
        return r.ok && Array.isArray(j) ? j.length : 0;
      } catch (e) { return 0; }
    }
    let swept = false;
    async function sweep() {
      if (swept) return;
      swept = true;
      const r = await rpc('nn_mod_photo_sweep', { p_secret: secret });
      if (!r || r.error) return;                 // nn-ROUND2.sql not pasted yet: nothing to say
      const strays = Array.isArray(r.strays) ? r.strays : [];
      const gone = strays.length ? await removeFiles(strays) : 0;
      const bits = [];
      if (r.abandoned) bits.push(r.abandoned + (r.abandoned === 1 ? ' board photo' : ' board photos') + ' nobody posted left the photo queue');
      if (gone) bits.push(gone + (gone === 1 ? ' stray picture file' : ' stray picture files') + ' cleared from the bucket');
      if (strays.length > gone) bits.push((strays.length - gone) + ' stray picture ' + (strays.length - gone === 1 ? 'file is' : 'files are') + ' waiting: the bucket would not let the desk remove ' + (strays.length - gone === 1 ? 'it' : 'them') + ' (SETUP-STEPHEN.md, part D)');
      if (!bits.length) return;
      const p = document.createElement('p');
      p.className = 'sheet-note';
      p.dataset.sweep = '';
      p.textContent = 'Photo sweep: ' + bits.join('; ') + '.';
      $('desk').before(p);              // above the desk, which redraws after every action
    }

    /* People's plans whose hosts ticked "put this on Meetup" (nn_people_meetup_list) */
    async function meetups(host, btn) {
      btn.disabled = true;
      const r = await rpc('nn_people_meetup_list', { p_secret: secret });
      btn.disabled = false;
      host.innerHTML = '';
      const note = (t) => { const p = document.createElement('p'); p.className = 'sheet-note'; p.textContent = t; host.appendChild(p); };
      if (!r || r.error) { note(r && r.error === 'not_installed' ? 'The Meetup list isn’t set up yet: paste all-day/supabase/nn-ROUND2.sql (SETUP-STEPHEN.md, part D).' : 'Didn’t work: ' + ((r && r.error) || 'offline')); return; }
      const plans = Array.isArray(r.plans) ? r.plans : [];
      if (!plans.length) { note('No live plans are down for Meetup right now.'); return; }
      plans.forEach((p) => {
        const AGES = { twenties: 'mostly 20s', thirties: 'mostly 30s', forties: 'mostly 40s', fifties: '50 and up', any: 'any age' };
        const bits = [p.when, p.place, p.spots ? p.spots + (p.spots === 1 ? ' spot' : ' spots') : '', AGES[p.ages] || '', 'hosted by ' + p.author, p.going + ' going'].filter(Boolean);
        const d = document.createElement('div');
        d.className = 'desk-post';
        d.dataset.meetup = p.id;
        d.innerHTML = '<div><div class="t">' + esc(p.title) + '</div><div class="d">' + esc(bits.join(' · ')) + '</div><div class="linkrow"></div></div>';
        const copy = document.createElement('button');
        copy.className = 'btn sm ghost';
        copy.textContent = 'Copy for Meetup';
        copy.addEventListener('click', () => {
          const text = [p.title, [p.when, p.place].filter(Boolean).join(', '), 'Hosted by ' + p.author + ', from the Btown Brief’s All Day.'].join('\n');
          (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => toast('Copied'), () => toast('Couldn’t copy'));
        });
        d.querySelector('.linkrow').appendChild(copy);
        host.appendChild(d);
      });
    }

    /* The No-algorithm challenge's answers (nn_challenge_list, behind the same
       passphrase; supabase/nn-CHALLENGE.sql). Tallies first, then every
       answer, newest first. No names: a row is a phone, never a person. */
    const DEMO_CHALLENGE = { count: 2, archetypes: { nightowl: 1, foodie: 1 }, missed: { friends: 2, messages: 1 }, feelings: { calmer: 3, caved: 1, great: 2 },
      rows: [
        { updated_at: new Date().toISOString(), source: 'newsletter', day: 6, feed_free_days: 4, feelings: ['1:calmer', '2:great', '3:caved', '4:calmer', '5:great'], missed: ['friends', 'messages'], missed_other: 'Bird photos from the Intervale group', switch_for: 'A place for my run club’s chat', archetype: 'joiner', archetype_words: '' },
        { updated_at: new Date(Date.now() - 86400000).toISOString(), source: 'link', day: 3, feed_free_days: 2, feelings: ['1:calmer', '2:calmer'], missed: ['friends'], missed_other: '', switch_for: 'Show times for Higher Ground on the Wire', archetype: 'nightowl', archetype_words: 'night shift nurse' },
      ] };
    async function challenge(host, btn) {
      btn.disabled = true;
      const r = demo ? DEMO_CHALLENGE : await rpc('nn_challenge_list', { p_secret: secret });
      btn.disabled = false;
      host.innerHTML = '';
      const note = (t) => { const p = document.createElement('p'); p.className = 'sheet-note'; p.textContent = t; host.appendChild(p); return p; };
      if (!r || r.error) { note(r && r.error === 'not_installed' ? 'The challenge’s table isn’t set up yet: run bash scripts/setup_boards.sh challenge (newsletter repo) and paste.' : 'Didn’t work: ' + ((r && r.error) || 'offline')); return; }
      const name = (list, k) => (list.find((x) => x[0] === k) || [k, k])[1];
      const tally = (label, obj, list) => {
        const bits = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]).map(([k, n]) => name(list, k) + ' ' + n);
        note(label + ': ' + (bits.length ? bits.join(' · ') : 'none yet'));
      };
      note((r.count || 0) + (r.count === 1 ? ' answer' : ' answers') + ' so far.');
      tally('Kinds of person', r.archetypes, ARCHETYPES);
      tally('Missed', r.missed, MISSED);
      tally('How days felt', r.feelings, FEELINGS);
      (r.rows || []).forEach((x) => {
        const d = document.createElement('div');
        d.className = 'desk-post';
        d.dataset.challenge = '';
        const top = [x.archetype ? name(ARCHETYPES, x.archetype) : '', x.archetype_words ? '“' + x.archetype_words + '”' : '',
          x.day ? (x.day > 5 ? 'finished' : 'day ' + x.day) : 'not joined', (x.feed_free_days || 0) + ' feed-free', 'from ' + x.source, when(x.updated_at)].filter(Boolean);
        const feel = (x.feelings || []).map((f) => 'day ' + f.split(':')[0] + ' ' + name(FEELINGS, f.split(':')[1]).toLowerCase()).join(', ');
        const missed = (x.missed || []).map((k) => name(MISSED, k)).concat(x.missed_other ? [x.missed_other] : []).join(', ');
        d.innerHTML = '<div><div class="t">' + esc(top.join(' · ')) + '</div>' +
          (x.switch_for ? '<p class="desk-body">' + esc(x.switch_for) + '</p>' : '') +
          (missed ? '<div class="d">Missed: ' + esc(missed) + '</div>' : '') +
          (feel ? '<div class="d">' + esc(feel) + '</div>' : '') + '</div>';
        host.appendChild(d);
      });
    }

    let toastT = 0;
    function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2400); }
    const photoUrl = (path) => (demo ? null : store.SB_URL + '/storage/v1/object/public/btb-photos/' + path.split('/').map(encodeURIComponent).join('/'));
    const when = (iso) => new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

    function row(p, acts) {
      const bits = [BOARD_LABELS[p.board] || p.board, p.kind, p.author, when(p.created_at)];
      if (p.reports) bits.push(p.reports + (p.reports === 1 ? ' report' : ' reports'));
      if (p.photo_state && p.photo_state !== 'none') bits.push('photo ' + p.photo_state);
      const meta = Object.entries(p.meta || {}).map(([k, v]) => k + ': ' + v).join(' · ');
      const reasons = (p.reasons || []).map((r) => REASON_LABELS[r] || r).join(', ');
      const d = document.createElement('div');
      d.className = 'desk-post';
      d.dataset.id = p.id;
      d.innerHTML = (p.photo_path && photoUrl(p.photo_path) ? '<img class="desk-pic" alt="" loading="lazy" src="' + esc(photoUrl(p.photo_path)) + '">' : '') +
        '<div><div class="t">' + esc(p.title) + '</div><div class="d">' + esc(bits.join(' · ')) + '</div>' +
        (meta ? '<div class="d">' + esc(meta) + '</div>' : '') + (p.place ? '<div class="d">' + esc(p.place) + '</div>' : '') +
        (p.body ? '<p class="desk-body">' + esc(p.body) + '</p>' : '') + (reasons ? '<div class="d">Reported as: ' + esc(reasons) + '</div>' : '') +
        '<div class="linkrow"></div></div>';
      const bar = d.querySelector('.linkrow');
      acts.forEach(([action, label, cls]) => {
        const b = document.createElement('button');
        b.className = 'btn sm ' + (cls || 'ghost');
        b.textContent = label;
        b.dataset.action = action;
        b.addEventListener('click', async () => {
          if (action === 'ban' && !confirm('Ban ' + p.author + '? They can no longer post or report, and every post of theirs is hidden.')) return;
          const r = await rpc('nn_mod_act', { p_secret: secret, p_post: p.id, p_action: action });
          if (r && r.ok) { toast(label + ': done'); load(); } else toast('Didn’t work: ' + ((r && r.error) || 'offline'));
        });
        bar.appendChild(b);
      });
      return d;
    }
    function section(host, title, list, acts, empty) {
      const h = document.createElement('h2');
      h.className = 'sheet-h';
      h.textContent = title + ' (' + list.length + ')';
      host.appendChild(h);
      if (!list.length) { const p = document.createElement('p'); p.className = 'sheet-note'; p.textContent = empty; host.appendChild(p); return; }
      list.forEach((p) => host.appendChild(row(p, acts)));
    }

    async function load() {
      const r = await rpc('nn_mod_list', { p_secret: secret });
      if (!r || r.error) {
        $('desk').hidden = true;
        $('gate').hidden = false;
        $('gate-msg').textContent = !r || r.error === 'bad_secret' ? (secret ? 'That passphrase didn’t open it. Twenty wrong tries shut the desk for 15 minutes.' : '')
          : r.error === 'not_installed' ? 'The boards aren’t set up in Supabase yet: paste all-day/supabase/nn-SETUP.sql first.' : 'Couldn’t reach Supabase. Try again in a moment.';
        if (r && r.error === 'bad_secret') sessionStorage.removeItem('nn-mod');
        return;
      }
      sessionStorage.setItem('nn-mod', secret);
      sweep();                          // stray board photos, once a visit
      $('gate').hidden = true;
      $('gate-msg').textContent = demo ? 'Demo desk: nothing here is real or saved.' : '';
      const desk = $('desk');
      desk.innerHTML = '';
      desk.hidden = false;
      section(desk, 'Waiting for you', r.waiting, [['approve', 'Approve', ''], ['hide', 'Hide'], ['delete', 'Delete'], ['ban', 'Ban', 'danger']], 'Nothing waiting.');
      const mh = document.createElement('h2');
      mh.className = 'sheet-h';
      mh.textContent = 'People: down for Meetup';
      desk.appendChild(mh);
      const mrow = document.createElement('div');
      mrow.className = 'linkrow';
      const mbtn = document.createElement('button');
      mbtn.className = 'btn sm';
      mbtn.textContent = 'Show the Meetup list';
      mbtn.dataset.meetups = '';
      const mlist = document.createElement('div');
      mbtn.addEventListener('click', () => meetups(mlist, mbtn));
      mrow.appendChild(mbtn);
      desk.append(mrow, mlist);
      const ch = document.createElement('h2');
      ch.className = 'sheet-h';
      ch.textContent = 'No-algorithm challenge';
      const crow = document.createElement('div');
      crow.className = 'linkrow';
      const cbtn = document.createElement('button');
      cbtn.className = 'btn sm';
      cbtn.textContent = 'Show the feedback';
      cbtn.dataset.challengeBtn = '';
      const clist = document.createElement('div');
      cbtn.addEventListener('click', () => challenge(clist, cbtn));
      crow.appendChild(cbtn);
      desk.append(ch, crow, clist);
      section(desk, 'Reported once, still up', r.reported, [['approve', 'Keep it'], ['hide', 'Hide'], ['ban', 'Ban', 'danger']], 'No open reports.');
      section(desk, 'Live now, newest 50', r.recent, [['hide', 'Hide'], ['delete', 'Delete']], 'No posts yet.');
      section(desk, 'Hidden', r.hidden, [['approve', 'Put it back']], 'Nothing hidden.');
      const h = document.createElement('h2');
      h.className = 'sheet-h';
      h.textContent = 'Banned (' + r.bans.length + ')';
      desk.appendChild(h);
      r.bans.forEach((b) => {
        const d = document.createElement('div');
        d.className = 'sheet-row';
        d.innerHTML = '<div class="t">' + esc(b.name || 'No name') + '<div class="d">since ' + esc(when(b.created_at)) + '</div></div>';
        const u = document.createElement('button');
        u.className = 'btn ghost sm';
        u.textContent = 'Unban';
        u.addEventListener('click', async () => { const x = await rpc('nn_mod_unban', { p_secret: secret, p_user: b.user_id }); toast(x && x.ok ? 'Unbanned' : 'Didn’t work'); load(); });
        d.appendChild(u);
        desk.appendChild(d);
      });
    }
    $('gate').addEventListener('submit', (e) => { e.preventDefault(); secret = $('pass').value; load(); });
    if (secret) load();
  </script>
</body>
</html>
