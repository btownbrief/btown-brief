<body>

<div class="app">

  <!-- Five panes in one stack. Only the active one is shown; each keeps its
       own scroll position because each is its own scrolling box. -->
  <div class="panes" id="panes">
    <section class="pane" id="pane-read"   aria-label="Read"   hidden></section>
    <section class="pane" id="pane-reddit" aria-label="Reddit" hidden></section>
    <section class="pane" id="pane-watch"  aria-label="Watch"  hidden></section>
    <section class="pane" id="pane-listen" aria-label="Listen" hidden></section>
    <section class="pane" id="pane-wander" aria-label="Wander" hidden></section>
  </div>

  <header class="topbar" id="topbar">
    <div class="wordmark" id="wordmark">All <b>Day</b></div>
    <div class="top-acts">
      <button class="iconbtn" id="btn-search" aria-label="Search" title="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
      <button class="iconbtn" id="btn-saved" aria-label="Saved" title="Saved">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17l-6-4.2-6 4.2z"/></svg>
        <span class="saved-count" id="saved-count" hidden>0</span>
      </button>
      <a class="iconbtn is-live" href="/live.html" aria-label="The Pulse Live" title="The Pulse Live — the no-scroll board">
        <span class="dot"></span>
      </a>
    </div>
  </header>

  <div class="dock" id="dock">
    <!-- The player lives in the shell, not in a pane, so it keeps playing
         while you switch tabs. -->
    <div class="player" id="player" hidden>
      <img class="player-art" id="player-art" alt="" hidden>
      <div class="player-art" id="player-art-fallback">🎙</div>
      <div class="player-txt">
        <div class="player-t" id="player-t"></div>
        <div class="player-s" id="player-s"></div>
        <div class="player-bar" id="player-bar" role="slider" aria-label="Seek" tabindex="0"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="player-fill"></i></div>
      </div>
      <button class="player-btn ghost" id="player-back" aria-label="Back 15 seconds" title="Back 15s">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5L6 9l5 4"/><path d="M6 9h7a5 5 0 0 1 0 10H9"/></svg>
      </button>
      <button class="player-btn" id="player-toggle" aria-label="Pause">
        <svg viewBox="0 0 24 24" aria-hidden="true" id="player-icon"><rect x="7" y="5" width="3.6" height="14" rx="1"/><rect x="13.4" y="5" width="3.6" height="14" rx="1"/></svg>
      </button>
      <button class="player-btn ghost" id="player-close" aria-label="Close player">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Modes">
      <button data-tab="read" class="on" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        Read
      </button>
      <button data-tab="reddit">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8 8 0 0 1-8 8H8l-4.5 2.5 1.2-4.2A8 8 0 0 1 11 3.5h2a8 8 0 0 1 8 8z"/></svg>
        Reddit
      </button>
      <button data-tab="watch">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="3.5"/><path d="M10.2 9.4l5 2.6-5 2.6z"/></svg>
        Watch
      </button>
      <button data-tab="listen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14.5v-2.5a8 8 0 0 1 16 0v2.5"/><rect x="2" y="13.5" width="4.6" height="7" rx="2.3"/><rect x="17.4" y="13.5" width="4.6" height="7" rx="2.3"/></svg>
        Listen
      </button>
      <button data-tab="wander">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.7 8.3l-2.1 5.3-5.3 2.1 2.1-5.3z"/></svg>
        Wander
      </button>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title">Saved</h2>
      <button class="iconbtn" id="sheet-close" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <!-- No crossorigin attribute. Podcast CDNs do not send CORS headers on
       media, so flagging the element anonymous makes every enclosure fail to
       load. It is only needed for Web Audio or canvas, and we do neither. -->
  <audio id="audio" preload="none"></audio>
</div>

<!-- The repo's ?v=YYYYMMDD<letter> rule is stamped on the entry points only.
     ES module imports inside app.js cannot carry a version without a build
     step, so freshness for those is the service worker's job: it serves every
     /all-day/ file network-first and falls back to cache only when offline,
     which means a deploy lands immediately. Bump the stamps below when you
     touch app.css or app.js; the modules follow on their own. -->
<script type="module" src="js/app.js?v=20260828a"></script>
</body>
</html>
