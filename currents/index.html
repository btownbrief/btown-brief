<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Currents — Btown Brief</title>
  <meta name="description" content="One place, all day: the Pulse wire, Reddit, Btown TV, podcasts, and a Wikipedia rabbit hole.">
  <meta property="og:title" content="Currents — Btown Brief">
  <meta property="og:description" content="Headlines, Reddit, video, podcasts, and a Wikipedia rabbit hole — one app, all day.">
  <meta property="og:image" content="../assets/og/og-guide.jpg">
  <meta name="theme-color" content="#06080A">
  <link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Currents">
  <script>/* dark-only app: hold the theme */document.documentElement.setAttribute('data-theme','dark');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/currents.css?v=20260828a">
</head>
<body data-btown-about="off">
  <script src="https://play.btownbrief.com/nav.js" defer></script>

  <header class="c-mast" id="mast">
    <div class="c-mast-in">
      <div class="c-brand">
        <span class="c-wordmark">Currents</span>
        <span class="c-tag">Everything, one place, all day</span>
      </div>
      <div class="c-mast-actions">
        <a class="live-pill" id="live-pill" href="../live.html" title="Pulse Live — the full-screen headline board">
          <i></i>LIVE
        </a>
        <button class="mp-btn" id="saved-btn" aria-label="Saved">
          <svg viewBox="0 0 24 24"><path d="m12 4 2.35 4.9 5.4.75-3.9 3.75.93 5.35L12 16.2 7.22 18.75l.93-5.35L4.25 9.65l5.4-.75z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <div class="c-stale" id="stale-note" hidden>Showing an older edition — reconnecting…</div>
  </header>

  <main class="app" id="app">
    <section class="tab-panel" id="panel-pulse"  role="tabpanel" aria-labelledby="tab-pulse"></section>
    <section class="tab-panel" id="panel-reddit" role="tabpanel" aria-labelledby="tab-reddit" hidden></section>
    <section class="tab-panel" id="panel-watch"  role="tabpanel" aria-labelledby="tab-watch" hidden></section>
    <section class="tab-panel" id="panel-listen" role="tabpanel" aria-labelledby="tab-listen" hidden></section>
    <section class="tab-panel" id="panel-read"   role="tabpanel" aria-labelledby="tab-read" hidden></section>
  </main>

  <div class="miniplayer" id="miniplayer" hidden>
    <img class="mp-art" id="mp-art" alt="" hidden>
    <div class="mp-meta">
      <span class="mp-title" id="mp-title"></span>
      <span class="mp-show" id="mp-show"></span>
    </div>
    <div class="mp-progress" id="mp-progress" aria-hidden="true"><i></i></div>
    <button class="mp-btn mp-back" id="mp-back" aria-label="Back 15 seconds" hidden>
      <svg viewBox="0 0 24 24"><path d="M11 8 5.5 12 11 16M18 8l-5.5 4L18 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="mp-btn mp-toggle" id="mp-toggle" aria-label="Play or pause">
      <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
      <svg class="ic-pause" viewBox="0 0 24 24" hidden><path d="M8 5.5v13M16 5.5v13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <button class="mp-btn mp-close" id="mp-close" aria-label="Close player">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <audio id="mp-audio" preload="none"></audio>
  </div>

  <div class="embedbox" id="embedbox" hidden>
    <div class="eb-card">
      <div class="eb-head">
        <span class="eb-title" id="eb-title"></span>
        <button class="mp-btn eb-close" id="eb-close" aria-label="Close video">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="eb-frame" id="eb-frame"></div>
      <div class="eb-foot">
        <span class="eb-hint" id="eb-hint" hidden>Not playing? Some videos block embedding.</span>
        <a class="eb-open" id="eb-open" href="#" target="_blank" rel="noopener">Open in YouTube
          <svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      </div>
    </div>
  </div>

  <div class="savedrawer" id="savedrawer" hidden>
    <div class="sd-scrim" id="sd-scrim"></div>
    <aside class="sd-card" role="dialog" aria-label="Saved">
      <div class="sd-head">
        <span class="sd-title">Saved</span>
        <button class="mp-btn" id="sd-close" aria-label="Close saved">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="sd-list" id="sd-list"></div>
    </aside>
  </div>

  <div class="c-toast" id="toast" hidden></div>

  <nav class="tabbar" role="tablist" aria-label="Currents sections">
    <button class="tab is-active" role="tab" id="tab-pulse" data-tab="pulse" aria-selected="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h3.5L9 6.5l4.5 11L16 12h5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Pulse</span>
    </button>
    <button class="tab" role="tab" id="tab-reddit" data-tab="reddit" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="6.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9.6" cy="13" r="1.15" fill="currentColor"/><circle cx="14.4" cy="13" r="1.15" fill="currentColor"/><path d="M9.2 16.4c1.7 1.2 3.9 1.2 5.6 0M12 7.2l.9-3.4 3 .9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16.6" cy="4.4" r="1.15" fill="currentColor"/></svg>
      <span>Reddit</span>
    </button>
    <button class="tab" role="tab" id="tab-watch" data-tab="watch" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10.2 9.4v5.2l4.8-2.6z" fill="currentColor"/></svg>
      <span>Watch</span>
    </button>
    <button class="tab" role="tab" id="tab-listen" data-tab="listen" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 15.5v-3a7.5 7.5 0 0 1 15 0v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="3.4" y="13.6" width="4" height="6" rx="2" fill="currentColor"/><rect x="16.6" y="13.6" width="4" height="6" rx="2" fill="currentColor"/></svg>
      <span>Listen</span>
    </button>
    <button class="tab" role="tab" id="tab-read" data-tab="read" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m15.6 8.4-2 5.2-5.2 2 2-5.2z" fill="currentColor"/></svg>
      <span>Wander</span>
    </button>
  </nav>

  <noscript><p class="c-empty">Currents needs JavaScript.</p></noscript>

  <script src="js/wire.js?v=20260828a"></script>
  <script src="js/shell.js?v=20260828a"></script>
  <script src="js/pulse-tab.js?v=20260828a"></script>
  <script src="js/reddit-tab.js?v=20260828a"></script>
  <script src="js/watch-tab.js?v=20260828a"></script>
  <script src="js/listen-tab.js?v=20260828a"></script>
  <script src="js/wander.js?v=20260828a"></script>
  <script>
    /* every tab module has registered by now — route for the first time */
    Currents.boot();
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {});
      });
    }
  </script>
</body>
</html>
