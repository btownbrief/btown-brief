name: Refresh the Watch tab's films

# Builds the three files All Day's Watch tab reads off the `films-data` branch:
#
#   data/films.json         scripts/build_films.py, Mondays and Thursdays.
#                           TMDB's top 300 films, trending films, coming
#                           soon, in theaters now, coming to streaming
#                           (with JustWatch's services, via TMDB), and the
#                           shows: top rated, trending, airing, and new
#                           seasons coming to the streamers.
#   data/time-machine.json  scripts/build_time_machine.py, the 2nd of each
#                           month. What was big each month for five years:
#                           the titles in data/time-machine-titles.json
#                           (harvested from the Wayback Machine's copies of
#                           Rotten Tomatoes' front page, on a machine where
#                           archive.org answers: it refuses GitHub's runners),
#                           matched to TMDB here. A month not harvested yet
#                           comes from TMDB's own most popular releases.
#   data/showtimes.json     scripts/build_showtimes.py, every morning. Times
#                           at Partizanfilm, Majestic 10 and Essex Cinemas,
#                           from each theater's own showtimes page. Essex's
#                           firewall turns GitHub's runners away (405), so
#                           Stephen's Mac reads that page and sends its
#                           screenings as the `essex` input
#                           (scripts/send_essex_showtimes.sh); a theater that
#                           fails keeps its times still ahead from the last file.
#
# Same publishing shape as curate-top.yml: a single orphan commit,
# force-pushed, fetched by the page straight off raw.githubusercontent.com,
# so new data never queues a Pages deploy. Each run starts from the branch's
# current files and replaces only what it rebuilt, so the daily showtimes
# never wipe the weekly films.
#
# The key: a repository secret named TMDB_API_KEY. Without it the films and
# the time machine skip quietly; showtimes still build (their TMDB match,
# which adds posters, is skipped).
#
# OMDB_API_KEY, a second secret, adds Rotten Tomatoes scores to the film list.
# Without it the list builds with no scores. data/tomatoes.json, the scores
# already asked for, rides on the films-data branch from run to run.
#
# Failure posture: a builder that fails writes nothing and the branch keeps
# that file's last good copy; whatever did build is still published, and
# the run then fails (red, so it is seen). A manual run from any branch but
# main never publishes: it uploads what it built as an artifact instead.

on:
  schedule:
    # films: Mondays and Thursdays, about 6:20 am Eastern (TMDB's "upcoming"
    # turns over weekly; Thursday catches the weekend's streaming drops)
    - cron: '20 10 * * 1,4'
    # the time machine: the 2nd of the month, about 6:40 am Eastern
    - cron: '40 10 2 * *'
    # showtimes: every morning, about 6:05 am Eastern
    - cron: '5 10 * * *'
  workflow_dispatch:
    inputs:
      what:
        description: 'What to build'
        type: choice
        options: [all, films, time-machine, showtimes]
        default: all
      essex:
        description: "Essex Cinemas' screenings, read on the Mac (build_showtimes.py --essex-dump); leave empty"
        type: string
        required: false
        default: ''

concurrency:
  group: refresh-films
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Decide what this run builds
        id: plan
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          WHAT: ${{ inputs.what }}
        run: |
          films=false; tm=false; shows=false
          if [ "$EVENT" = "schedule" ]; then
            case "$SCHEDULE" in
              '20 10 * * 1,4') films=true ;;
              '40 10 2 * *') tm=true ;;
              *) shows=true ;;
            esac
          else
            case "${WHAT:-all}" in
              films) films=true ;;
              time-machine) tm=true ;;
              showtimes) shows=true ;;
              *) films=true; tm=true; shows=true ;;
            esac
          fi
          if [ -z "$TMDB_API_KEY" ]; then
            echo "no TMDB_API_KEY secret: films and the time machine skip"
            films=false; tm=false
          fi
          echo "films=$films" >> "$GITHUB_OUTPUT"
          echo "tm=$tm" >> "$GITHUB_OUTPUT"
          echo "shows=$shows" >> "$GITHUB_OUTPUT"
          echo "films=$films time-machine=$tm showtimes=$shows"

      - name: Run the builders' offline checks
        run: |
          python3 scripts/build_films.py --selftest
          python3 -m unittest tests.test_build_time_machine tests.test_build_showtimes

      - name: Start from the branch's current files
        run: |
          # an empty start only when the branch truly does not exist: a clone
          # that fails for any other reason stops here, before a push could
          # replace the branch with this run's one file
          repo="https://github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$repo" films-data >/dev/null; then
            git clone -q --depth 1 --branch films-data "$repo" /tmp/films-out
          else
            echo "no films-data branch yet: starting empty"
            mkdir -p /tmp/films-out
          fi
          rm -rf /tmp/films-out/.git
          mkdir -p /tmp/films-out/data /tmp/films-new/data

      - name: Build the film list
        id: films
        if: steps.plan.outputs.films == 'true'
        continue-on-error: true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          python3 scripts/build_films.py --out /tmp/films-new/data/films.json \
            --tomatoes-prev /tmp/films-out/data/tomatoes.json

      - name: Build the time machine
        id: tm
        if: steps.plan.outputs.tm == 'true'
        continue-on-error: true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python3 scripts/build_time_machine.py --no-wayback \
            --titles data/time-machine-titles.json \
            --prev /tmp/films-out/data/time-machine.json \
            --out /tmp/films-new/data/time-machine.json

      - name: Build today's showtimes
        id: shows
        if: steps.plan.outputs.shows == 'true'
        continue-on-error: true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ESSEX: ${{ inputs.essex }}
        run: |
          # the input goes through a file, never through the shell's words
          printf '%s' "$ESSEX" > /tmp/essex.json
          python3 scripts/build_showtimes.py --out /tmp/films-new/data/showtimes.json \
            --prev /tmp/films-out/data/showtimes.json --essex-json /tmp/essex.json

      - name: Lay the new files over the old
        id: lay
        run: |
          n=0
          for f in /tmp/films-new/data/*.json; do
            [ -s "$f" ] || continue
            cp "$f" /tmp/films-out/data/
            echo "new: $(basename "$f") ($(wc -c < "$f") bytes)"
            n=$((n + 1))
          done
          echo "n=$n" >> "$GITHUB_OUTPUT"

      - name: Force-push the single-commit films-data branch
        if: steps.lay.outputs.n != '0' && github.ref == 'refs/heads/main'
        run: |
          cd /tmp/films-out
          git init -q -b films-data
          git config user.name "btown-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -q -m "Films $(date -u +%FT%TZ)"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            films-data

      - name: Keep what a branch run built (it never publishes)
        if: steps.lay.outputs.n != '0' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: films-data-preview
          path: /tmp/films-new/data/
          retention-days: 7

      - name: Fail the run if a builder failed
        if: steps.films.outcome == 'failure' || steps.tm.outcome == 'failure' || steps.shows.outcome == 'failure'
        run: |
          echo "films: ${{ steps.films.outcome }}, time machine: ${{ steps.tm.outcome }}, showtimes: ${{ steps.shows.outcome }}"
          exit 1
