name: Deploy static site to GitHub Pages

# Publishes the repo root as-is (no Jekyll, no build step) using the
# modern GitHub Actions Pages pipeline.
#
# Triggers:
#  - push to main (human commits / PR merges)
#  - after EVERY data-refresh workflow, because commits they make with the
#    built-in GITHUB_TOKEN do NOT trigger `push` events. Listing only one
#    refresh workflow here meant weather, the read, events, jobs, etc. sat
#    on main undeployed until the next community-data run happened to fire
#    — the live page routinely ran hours behind the committed data.
#    Every workflow that commits to main belongs in this list.

on:
  push:
    branches: ["main"]
  workflow_run:
    workflows:
      - "Refresh community data"
      - "Refresh weather data"
      - "Publish morning read by 7 AM"
      - "Refresh change log"
      - "Curate GoodBurlington queue"
      - "Refresh civic meetings"
      - "Refresh events calendar"
      - "Refresh jobs data"
      - "Refresh rent snapshot"
      - "Community photos housekeeping"
      - "Openings & Closings radar"
      - "Refresh the Wander pool"
      - "Refresh music data"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # A refresh that failed committed nothing (each script keeps last-good
    # data), so there is nothing new to publish — skip the deploy.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
