name: Refresh Pulse headlines

# Rebuilds the Burlington Pulse payload (local + national headlines from the
# two public Inoreader folders) every 20 minutes:
#   scripts/refresh_pulse.py -> data/pulse.json on the `pulse-data` branch
#
# The branch is force-pushed as a single orphan commit each run — history
# for a headline ticker is pure noise, and 72 commits/day would bury main.
# pulse.html fetches the file from raw.githubusercontent.com (CORS-open,
# ~5 minute edge cache), so headline freshness never queues a Pages deploy.
# That is why this workflow is deliberately NOT in pages-deploy.yml's
# workflow_run list; data/pulse.json on main is only a first-paint fallback.
#
# Failure posture: the script refuses to write a suspiciously small payload
# and exits non-zero on any hard fetch failure, so a bad run pushes nothing
# and the page keeps the last good data.

on:
  schedule:
    # Every 10 minutes, off the crowded :00/:15/:30 marks. GitHub sheds
    # scheduled ticks under load (three of the first four 20-minute slots
    # never fired on day one) — denser slots make the misses not matter,
    # and the refresh script's no-new-items skip keeps surplus runs from
    # pushing anything, so the effective publish rate stays content-driven.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# A manual run and a scheduled run racing at push would strand one of them.
concurrency:
  group: refresh-pulse
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard private paths (never tracked in this public repo)
        run: |
          if git ls-files | grep -E '^(data/tips-inbox\.md|data/fpf-digests/|data/fpf-dropbox/|\.chatter-dev/)'; then
            echo "::error::private tip-line files are tracked in git — aborting"
            exit 1
          fi

      - name: Pull previous payload from the pulse-data branch
        run: |
          if git ls-remote --exit-code --heads origin pulse-data >/dev/null; then
            # The branch exists, so a fetch failure must FAIL this run —
            # falling back to main's frozen snapshot here would force-push
            # away the rolling store that quiet sources depend on.
            git fetch -q origin pulse-data --depth 1
            git show FETCH_HEAD:data/pulse.json > /tmp/pulse-prev.json
            [ -s /tmp/pulse-prev.json ]
          else
            # True first run: seed from the snapshot committed on main.
            cp data/pulse.json /tmp/pulse-prev.json
          fi

      - name: Refresh pulse data
        run: |
          python3 scripts/refresh_pulse.py --selftest
          mkdir -p /tmp/pulse-out
          python3 scripts/refresh_pulse.py \
            --store /tmp/pulse-prev.json \
            --out /tmp/pulse-out/data/pulse.json

      - name: Force-push the single-commit pulse-data branch
        run: |
          if [ ! -s /tmp/pulse-out/data/pulse.json ]; then
            echo "No new items this run — branch left as-is."
            exit 0
          fi
          cd /tmp/pulse-out
          git init -q -b pulse-data
          git config user.name "btown-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pulse.json
          git commit -q -m "Pulse data $(date -u +%FT%TZ)"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            pulse-data
