name: Curate GoodBurlington queue

# Builds the tap-to-post crosspost queue for r/GoodBurlington:
#   scripts/queue_goodburlington.py -> data/goodburlington-queue.json
# Stephen posts everything himself from goodburlington-queue.html — this
# job never signs in as him and never posts. If the optional
# REDDIT_CLIENT_ID/SECRET secrets exist, it reads Reddit's listings with a
# read-only app token (scripts/reddit_client.py); without them it reads
# the Inoreader RSS streams only, including the r/GoodBurlington stream
# that tells us what he already crossposted.
# Without OPENROUTER_API_KEY the script keeps the last good queue —
# nothing unjudged is ever queued.

on:
  schedule:
    # 3x daily, ahead of the ~8:45am ET queue-open on Stephen's Mac:
    # ~5:35 / 11:35 / 16:35 ET (EDT)
    - cron: '35 9,15,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goodburlington-queue
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Curate queue
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
        run: python3 scripts/queue_goodburlington.py

      - name: Commit if changed
        run: |
          git config user.name "btown-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/goodburlington-queue.json data/goodburlington-curated.json
          if git diff --cached --quiet; then
            echo "No queue changes."
          else
            git commit -m "Auto-refresh GoodBurlington queue"
            git pull --rebase origin main
            git push
          fi
