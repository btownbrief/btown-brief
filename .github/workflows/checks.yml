name: Out Loud checks

on:
  pull_request:
    paths: ['out-loud/**', '.github/workflows/checks.yml']
  push:
    branches: [main]
    paths: ['out-loud/**', '.github/workflows/checks.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test out-loud/engine.test.mjs
