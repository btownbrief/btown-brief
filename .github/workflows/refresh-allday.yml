# Rebuild the two All Day payloads that go stale fastest.
#
# What it writes:
#   all-day/data/whatnow.json    — the next ten days of the calendar, trimmed
#                                  to the fields a card renders. ~95 KB.
#   all-day/data/instagram.json  — recent posts from the Burlington accounts
#                                  in data/instagram-handles.json, each with a
#                                  `category` for the Wire's Photos chips.
#                                  ~500-750 KB.
#   data/instagram-ledger.json   — Scrape Creators credits spent this month
#                                  and when each account was last fetched;
#                                  the builder reads it back to keep inside
#                                  its monthly budget.
#   data/sports.json             — UVM, Burlington High, the local clubs and
#                                  five national teams. Feeds sports.html and
#                                  the games strip on All Day's What Now tab.
#                                  ~140 KB.
#
# WHY DAILY, AND WHY IT CANNOT SLIP. Instagram signs every image URL with an
# `oe` parameter. Measured 2026-08-30 against a live payload it sits 4.3-4.5
# days out. The builder carries forward posts whose signature is still good,
# which is how a ~250-handle roster fits in a ~60-credit day — but carrying
# forward only works if there is a recent payload to carry FROM. Miss three
# runs and there is nothing left to carry; miss four and the grid is broken
# frames. That is the binding constraint on this schedule.
#
# TWICE A DAY, BUT ONLY INSTAGRAM TWICE. The 21:10 UTC run (5:10pm in
# Burlington, an hour later in winter) exists for tier 1 of the Instagram
# roster — tonight's posters and vibe checks. What Now and sports build only
# on the morning cron (or a manual run), exactly as before.
#
# Order matters: it runs at 10:40 UTC, an hour after the events pipeline's
# 9:40, because build_whatnow.py reads data/events/. Running first would
# publish yesterday's calendar as today's answer.
#
# Credits: one Scrape Creators credit per request. Tier 1 every run, tier 2
# once a Burlington day, tier 3 once a week in even daily slices, all inside
# MONTHLY_CREDIT_BUDGET in scripts/build_instagram.py, which the builder
# enforces pro rata against the ledger. `--dry-run` prints a run's plan and
# the roster's steady-state cost without spending anything.
#
# Because it commits to main under GITHUB_TOKEN, and such commits do not fire
# a `push` event, this workflow's name is listed in pages-deploy.yml's
# workflow_run list. Rename it there too or the site serves yesterday's.
#
# Failure posture: each build refuses to overwrite a good payload with an
# empty one, and the two are independent — a missing Instagram key costs the
# Instagram tab and leaves What Now alone.

name: Refresh All Day hub data

on:
  schedule:
    - cron: "40 10 * * *"
    - cron: "10 21 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-allday
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build What Now
        if: github.event_name != 'schedule' || github.event.schedule == '40 10 * * *'
        run: python3 scripts/build_whatnow.py

      - name: Build sports
        if: github.event_name != 'schedule' || github.event.schedule == '40 10 * * *'
        run: python3 scripts/build_sports.py || echo "sports build skipped"

      - name: Build Instagram
        timeout-minutes: 30
        env:
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          SCRAPE_CREATORS_API_KEY: ${{ secrets.SCRAPE_CREATORS_API_KEY }}
        run: python3 scripts/build_instagram.py || echo "instagram build skipped"

      # always(): the Instagram ledger records credits before it spends them,
      # so it must land even when a step after it failed or timed out.
      - name: Commit if changed
        if: always()
        run: |
          git config user.name "btown-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add all-day/data/whatnow.json all-day/data/instagram.json data/instagram-ledger.json data/sports.json
          if git diff --cached --quiet; then
            echo "No hub changes."
          else
            git commit -m "Auto-refresh All Day hub data"
            git push || (git pull --rebase && git push)
          fi
