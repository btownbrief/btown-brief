name: Refresh Town data

# Feeds the Town app (Alerts, City Hall, Streets) from official sources.
# Scripts live in scripts/town/ and write only data/town/. Same contract as the
# other refresh workflows: the site stays static, a failed section keeps its last
# good copy (marked stale), and a file is rewritten only when its content changed,
# so most hourly runs commit nothing.
#
#   alerts.py   hourly, plus two more runs an hour across a four-hour early-morning window for school delays
#   signups.py  daily
#   streets.py  daily (permits export is weekly, sales post a few times a week)
#
# The geocoder cache stays out of the repo and the site (see scripts/town/geo.py), so
# actions/cache carries it from run to run. A run that finds none just looks up more.
#
# Manual run: Actions tab -> "Refresh Town data" -> Run workflow (pick which).
# Local run:  python3 -m scripts.town.alerts   (from the repo root)

on:
  schedule:
    - cron: '40 * * * *'        # alerts, hourly at :40 (offset from changes :25 and weather :45)
    - cron: '5,20 9-12 * * *'   # alerts, early-morning closings window (UTC 9-12 is four hours: 5-8am in EDT, 4-7am in EST)
    - cron: '50 10 * * *'       # daily: signups + streets
  workflow_dispatch:
    inputs:
      which:
        description: 'alerts, daily (signups + streets), or all'
        default: all
        type: choice
        options: [all, alerts, daily]

permissions:
  contents: write

concurrency:
  group: refresh-town
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore geocoder cache
        uses: actions/cache/restore@v4
        with:
          path: data/town/geo-cache.json
          key: town-geo-
          restore-keys: town-geo-

      - name: Decide what to run
        id: pick
        run: |
          which="${{ github.event.inputs.which }}"
          if [ -z "$which" ]; then
            if [ "${{ github.event.schedule }}" = "50 10 * * *" ]; then which=daily; else which=alerts; fi
          fi
          echo "which=$which" >> "$GITHUB_OUTPUT"

      - name: Alerts
        if: ${{ !cancelled() && (steps.pick.outputs.which == 'alerts' || steps.pick.outputs.which == 'all') }}
        run: python3 -m scripts.town.alerts

      - name: Signups
        if: ${{ !cancelled() && (steps.pick.outputs.which == 'daily' || steps.pick.outputs.which == 'all') }}
        run: python3 -m scripts.town.signups

      - name: Streets
        if: ${{ !cancelled() && (steps.pick.outputs.which == 'daily' || steps.pick.outputs.which == 'all') }}
        run: python3 -m scripts.town.streets

      - name: Feed
        if: ${{ !cancelled() }}
        run: python3 -m scripts.town.build_feed

      - name: Save geocoder cache
        if: ${{ always() && hashFiles('data/town/geo-cache.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/town/geo-cache.json
          key: town-geo-${{ hashFiles('data/town/geo-cache.json') }}

      - name: Commit if changed
        if: always()
        run: |
          git config user.name "btown-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/town/
          if git diff --cached --quiet; then
            echo "No Town data changes."
          else
            git commit -m "Auto-refresh Town data"
            git push || (git pull --rebase && git push)
          fi
