name: The Brief, out loud

# Each newsletter edition, read aloud word for word: the intro and the local
# news, for the On Air tab in All Day (Stephen, 2026-10-18). This replaced the
# daily two-minute recap the same day; the file keeps its name so its run
# history and the wire-audio branch stay where they were.
#
#   scripts/build_edition_audio.py -> data/audio/YYYY-MM-DD.mp3 (the edition's date)
#                                     data/audio/YYYY-MM-DD.txt (the words it read)
#                                     data/audio/index.json     (the last ten editions)
#                                     data/audio/cost.json      (the voice's spend, month to date)
# on the `wire-audio` branch, force-pushed as one orphan commit, so the page
# reads raw.githubusercontent.com and old MP3s never pile up in git history.
#
# Stephen publishes in Beehiiv whenever he is done, so this looks at the
# newsletter's RSS feed every hour from 8 am to midnight in Burlington and
# voices an edition the first time it sees one (one a run, at most four days
# old). A run with nothing new takes seconds and pushes nothing. About $1.50
# an edition at ElevenLabs' eleven_v4 rate; the script caps the month at $25.
#
# Secrets: ELEVENLABS_API_KEY (required; without it the run ends green and
# voices nothing) and ELEVENLABS_VOICE_ID (optional; default Wyatt).

on:
  schedule:
    - cron: '23 0-4,12-23 * * *'
  workflow_dispatch:
    inputs:
      edition:
        description: "Voice this edition (its btownbrief.com/p/... link) instead of the newest"
        type: string
        default: ''
      force:
        description: "Voice it again even if it is already up (costs about $1.50)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: wire-audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Offline tests (no network, no voice)
        run: python3 -m unittest tests.test_edition_audio

      - name: Check the key
        id: key
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "voice=none" >> "$GITHUB_OUTPUT"
            echo "### The Brief, out loud · no ELEVENLABS_API_KEY secret, nothing voiced" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "voice=on" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull the previous wire-audio branch
        id: pull
        if: steps.key.outputs.voice == 'on'
        run: |
          mkdir -p /tmp/wa
          # ls-remote --exit-code says 2 for "no such branch" and something
          # else for a network or auth failure. Only a confirmed "no such
          # branch" may start from nothing; anything else fails the run
          # rather than force-push away the editions already voiced.
          set +e
          git ls-remote --exit-code --heads origin wire-audio >/dev/null
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch -q origin wire-audio --depth 1
            git archive FETCH_HEAD | tar -x -C /tmp/wa
          elif [ "$status" -eq 2 ]; then
            echo "no wire-audio branch yet: first run"
          else
            echo "::error::could not reach the wire-audio branch (ls-remote exit $status)"
            exit 1
          fi
          mkdir -p /tmp/wa/data/audio

      - name: Make sure ffmpeg is here
        if: steps.key.outputs.voice == 'on'
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Voice the newest edition, if there is one
        id: run
        if: steps.key.outputs.voice == 'on'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          EDITION: ${{ inputs.edition }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python3 scripts/build_edition_audio.py --out-dir /tmp/wa/data/audio $FORCE ${EDITION:+--edition "$EDITION"}

      - name: Force-push the single-commit wire-audio branch
        # Only when the run wrote something (a clip, or the cost of a failed
        # one: the ledger is worth keeping). Never after a failed pull.
        if: always() && steps.pull.outcome == 'success' && steps.run.outputs.changed == 'true'
        run: |
          cd /tmp/wa
          rm -rf .git
          git init -q -b wire-audio
          git config user.name "btown-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -q -m "The Brief, out loud $(date -u +%FT%TZ)"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            wire-audio
