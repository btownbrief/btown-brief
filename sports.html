  <script>
    /* Theme before first paint, from the cached sunrise/sunset. js/auto-theme.js
       refreshes the cache; this only avoids the white flash after dark. */
    (function () {
      try {
        var c = JSON.parse(localStorage.getItem('btown-sun') || 'null');
        if (!c) return;
        var today = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York',
          year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
        if (c.day !== today) return;
        var n = Date.now();
        document.documentElement.setAttribute('data-theme',
          (n >= c.rise && n < c.set) ? 'light' : 'dark');
      } catch (e) {}
    })();
  </script>
