  <script>
    /* All Day's theme, before first paint. A board on a screen (TV, embedded in
       All Boards) stays dark; #all opens straight on the browse view. */
    try {
      var board = /[?&](tv|embed)=1/.test(location.search);
      var t = board ? 'dark' : localStorage.getItem('allday-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      if (!board && location.hash === '#all') document.documentElement.setAttribute('data-view', 'all');
    } catch (e) { /* private mode: the stylesheet default stands */ }
  </script>

<body>

  <header class="tt-mast">
    <a class="tt-home" href="all-day/#people/talk" aria-label="All Day"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/></svg></a>
    <h1 class="tt-brand">Table Talk</h1>
    <span class="clock" id="clock"></span>
    <span class="tt-status">
      <button class="tt-ic" id="join-btn" type="button" aria-label="Add a phone"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="sync-badge" id="sync-badge" type="button" aria-pressed="false"><i></i><span id="sync-badge-label">Sync</span></button>
    </span>
  </header>

  <nav class="tt-views chips" aria-label="View">
    <button class="chip" type="button" data-view="table"><span>Table</span></button>
    <button class="chip" type="button" data-view="all"><span>All cards</span></button>
  </nav>

  <main class="stage">
    <div class="tt-card tk-deep" id="card" role="button" tabindex="0" aria-label="The current card. Tap to hold it.">
      <span class="fuse" id="fuse" aria-hidden="true"></span>
      <span class="top"><span class="eyebrow kind-tag" id="kind-tag">Dealing</span><span class="eyebrow hold-tag">Held</span></span>
      <span class="body" id="body">
        <p class="big" id="big">Pulling up a chair…</p>
        <span class="kicker" id="kicker"></span>
      </span>
      <span class="meta"><span class="src" id="src"></span></span>
    </div>
  </main>

  <div class="lbarwrap">
    <footer class="lbar" id="lbar">
      <button class="btn ghost" id="prev-btn" type="button">Back</button>
      <button class="btn ghost" id="next-btn" type="button">Next</button>
      <span class="tt-sp"></span>
      <button class="btn ghost" id="set-btn" type="button">Settings</button>
    </footer>
  </div>

  <section class="browse" id="browse" aria-label="All cards"></section>

  <div class="scrim" id="panel-scrim" hidden></div>

  <aside class="panel" id="set-panel" hidden aria-label="Settings">
    <div class="panel-head">
      <h2>Settings</h2>
      <button class="panel-close" type="button" aria-label="Close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="sheet-h">Pace</div>
    <div class="lgroup" id="pace-group" role="group" aria-label="Pace">
      <button class="lopt" data-pace="relaxed" type="button">Relaxed</button>
      <button class="lopt" data-pace="normal" type="button">Normal</button>
      <button class="lopt" data-pace="lively" type="button">Lively</button>
    </div>
    <div class="sheet-h">Decks</div>
    <div class="lgroup" id="deck-group" role="group" aria-label="Decks"></div>
    <div class="sheet-h">Boards</div>
    <nav class="lgroup" aria-label="Switch board">
      <a class="lopt" href="pulse.html">Read</a>
      <a class="lopt" href="live.html">Watch</a>
      <a class="lopt" href="countdown/">Count</a>
      <span class="lopt on">Table</span>
      <a class="lopt" href="all.html">All</a>
      <a class="lopt" href="table.html?tv=1">TV</a>
    </nav>
  </aside>

  <aside class="panel" id="join-panel" hidden aria-label="Add a phone">
    <div class="panel-head">
      <h2>Add a phone</h2>
      <button class="panel-close" type="button" aria-label="Close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <p class="join-url">guide.btownbrief.com/<wbr>table.html?sync=1</p>
    <p class="join-actions">
      <button class="btn" id="copy-link" type="button">Copy link</button>
      <button class="btn ghost" id="share-link" type="button" hidden>Share</button>
    </p>
  </aside>

  <noscript><p class="noscript">Table Talk needs JavaScript to deal the cards.</p></noscript>
  <script src="js/table-talk.js?v=20261031a"></script>
  <script type="module" src="js/table-browse.js?v=20261031a"></script>
</body>
</html>
